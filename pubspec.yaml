name: e2ee_ap_v2
description: "Sprint 22 e2ee-ap-v2 — wirebare-kernel VPN + Flutter UI (Riverpod, go_router)."
publish_to: 'none'

# Semantic version: MAJOR.MINOR.PATCH+BUILD.
# 22.0 = Sprint 22 setup baseline.
version: 22.0.0+1

environment:
  sdk: ^3.12.1

dependencies:
  flutter:
    sdk: flutter

  # Cupertino iOS-style icons.
  cupertino_icons: ^1.0.8

  # Sprint 22 — state management + declarative routing + chart +
  # WhatsApp deep link. Matches the OpenE2EE Sprint 10.0 surface
  # (riverpod + go_router) so we can port the existing screens
  # incrementally in later sub-sprints (22.7+).
  flutter_riverpod: ^2.5.1
  go_router: ^14.0.0
  fl_chart: ^0.68.0
  url_launcher: ^6.2.0

  # Sprint 22 — backend BFF transport (Sprint 10.1B scope:
  # POST /api/v1/telemetry, GET /api/v1/matches).
  http: ^1.2.0

  # Sprint 23.2 — SHA-256 hashing for `public_key_fp` and
  # `tls_fp` stubs in `TelemetryService`. Pulled in as a
  # direct dependency (vs. `crypto` from `flutter_webrtc`)
  # because the wire-side fingerprinting (Sprint 24+) will
  # keep this in pure-Dart, not in the wirebare-kernel
  # layer.
  crypto: ^3.0.3

  # Sprint 22 — WebRTC P2P (Sprint 11.0B). Renamed from `webrtc`
  # to `flutter_webrtc` in 2024; the older `webrtc` 0.0.1 is
  # incompatible with Dart 3.12.1. Native AAR adds ~30 MB to
  # the APK (target < 200 MB).
  flutter_webrtc: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
